name: release

# Stages the release on npm with trusted publishing (OIDC): no token, with provenance.
# A maintainer approves it with 2FA (`pnpm stage approve` or npmjs.com) to make it public.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      - run: pnpm test
      - run: pnpm stage publish --provenance
