name: release

# Stages the release on npm with trusted publishing (OIDC): no token, with provenance.
# A maintainer approves it with 2FA (`pnpm stage approve` or npmjs.com) to make it public.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      - run: pnpm test
      - run: pnpm stage publish --provenance
