openapi: 3.1.0
paths: {}
components:
  schemas:
    Order: { type: string }
    Box:
      description: >-
        A schema in another file that no component names is named after its file or the
        last token of the pointer into it; a taken name gets a number. The same file is
        one type however often it is used.
      properties:
        a: { $ref: defs/Order.yaml }
        b: { $ref: defs/Order.yaml }
        c: { $ref: "defs/common.json#/Line%20Item" }
        d: { $ref: defs/order-status.yml }
        e: { $ref: "defs/common.json#/Order" }
        f: { $ref: "defs/common.json#/Count" }
        g: { $ref: defs/Amount.JSON }
        h: { $ref: defs/money.yaml }
    Status:
      description: Not only a $ref, so it does not name order-status.yml.
      $ref: defs/order-status.yml
      type: string
    Tally: { $ref: "defs/common.json#/Count" }
    Total:
      $ref: "defs/common.json#/Count"
      description: Only a $ref too; the first such component gives the name.
    Price:
      $ref: defs/money.yaml
      title: A title next to the $ref still makes it the file's name.
