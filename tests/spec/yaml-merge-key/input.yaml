openapi: 3.1.0
components:
  schemas:
    B: &b { type: string }
    A:
      <<: *b
      description: The merge key is YAML 1.1's; in YAML 1.2 it is a key named <<, no keyword, so A admits any value.
    Quoted:
      description: A quoted << is a key named << in YAML 1.1 too, so it has no warning.
      type: object
      properties:
        "<<": { type: string }
