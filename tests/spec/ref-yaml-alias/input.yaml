openapi: 3.1.0
paths: {}
components:
  schemas:
    Money: &money
      type: object
      properties:
        amount: { type: integer }
    Price: *money
    Order:
      description: A $ref names the component it points to, also where that component is a YAML alias of another.
      type: object
      properties:
        price: { $ref: "#/components/schemas/Price" }
        total: { $ref: "#/components/schemas/Money" }
