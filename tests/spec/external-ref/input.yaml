openapi: 3.1.0
paths:
  /users/{id}:
    $ref: paths/user.yaml
components:
  schemas:
    User:
      $ref: schemas/User.yaml
    Error:
      $ref: common.json#/Error
    Region:
      type: object
      properties:
        country:
          type: object
          properties:
            code: { $ref: "#/components/schemas/CountryCode" }
    CountryCode: { type: string }
